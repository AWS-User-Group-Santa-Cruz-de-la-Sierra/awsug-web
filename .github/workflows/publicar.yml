name: Publicar sitio

on:
  push:
    branches: [main]
  pull_request:
  # Todos los días a las 06:00 de Bolivia (10:00 UTC): los eventos que ya terminaron
  # pasan de "próximos" a "pasados", porque eso se decide con la fecha del build.
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Nunca dos publicaciones a la vez; un PR nuevo cancela el build anterior del mismo PR.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'publicar' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::939875366774:role/awsug-web-github-deploy
  STACK_NAME: awsug-web

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # El esquema valida fechas, horas y URLs de los eventos: si algo está mal, falla aquí.
      - run: npm run build

      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: dist
          path: dist/
          retention-days: 7

  publicar:
    name: Publicar en S3 + CloudFront
    needs: build
    # Solo desde main: el rol de AWS solo confía en refs/heads/main.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC para asumir el rol, sin llaves guardadas
    # Sin `environment:`: cambiaría el `sub` del token y el rol dejaría de confiar en él.
    steps:
      - name: Descargar el build
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Credenciales de AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Leer bucket y distribución del stack
        id: stack
        run: |
          salida() {
            aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text
          }
          echo "bucket=$(salida BucketName)" >> "$GITHUB_OUTPUT"
          echo "distribucion=$(salida DistributionId)" >> "$GITHUB_OUTPUT"

      # Archivos con hash de Astro: caché de un año.
      - name: Subir assets (_astro/)
        run: |
          aws s3 sync dist/_astro "s3://${{ steps.stack.outputs.bucket }}/_astro" --delete \
            --cache-control "public, max-age=31536000, immutable"

      # HTML, og.png, favicon: caché corta. --delete borra lo que ya no existe (un evento cancelado).
      - name: Subir páginas
        run: |
          aws s3 sync dist/ "s3://${{ steps.stack.outputs.bucket }}" --delete --exclude "_astro/*" \
            --cache-control "public, max-age=300"

      - name: Invalidar CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.stack.outputs.distribucion }}" --paths "/*" \
            --query 'Invalidation.[Id,Status]' --output text
